{{/*
Parent chart template — tests behavior A via the broken helper's downstream effect.
The broken helper uses pluck on keyMapping, which returns nil when keyMapping.password is null.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: parent-chart-output
type: Opaque
stringData:
  # Behavior A (broken helper): nil keyMapping.password causes "%!s(<nil>)" subPath — old helm: "%!s(<nil>)", new helm: "password"
  broken_password_key: {{ include "broken.secrets.key" (dict "existingSecret" .Values.existingSecret "key" "password") | quote }}

  # Behavior A (Bitnami common.secrets.key): same nil issue in the upstream helper — old helm: "%!s(<nil>)", new helm: "password"
  bitnami_password_key: {{ include "common.secrets.key" (dict "existingSecret" .Values.existingSecret "key" "password") | quote }}

  # Fixed helper for reference: correctly falls back to default key name regardless of helm version
  fixed_password_key: {{ include "fixed.secrets.key" (dict "existingSecret" .Values.existingSecret "key" "password") | quote }}

  # Behavior A: subchart nil defaults cleaned — old helm: "{}", new helm: "{\"password\":null}"
  keyMapping_debug: {{ (.Values.existingSecret).keyMapping | toJson | quote }}
  existingSecret_debug: {{ .Values.existingSecret | toJson | quote }}
---
{{/*
Job demonstrating the real-world failure mode — broken_password_key becomes "%!s(<nil>)"
which is used as a subPath, causing a directory mount instead of a file mount.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: subpath-demo-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: demo
          image: busybox
          command: ["cat", "/credentials/ldapread.secret"]
          volumeMounts:
            - mountPath: "/credentials/ldapread.secret"
              name: "secret-volume"
              subPath: {{ include "broken.secrets.key" (dict "existingSecret" .Values.existingSecret "key" "password") | quote }}
      volumes:
        - name: secret-volume
          secret:
            secretName: my-secret
